services:
  backend:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8123:8123"
    env_file:
      - .env
    volumes:
      - ./output:/output
    restart: unless-stopped

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8123
    depends_on:
      - backend
    restart: unless-stopped