  <rect x="224" y="150" width="156" height="4" fill="#90aaff"/>
  <text x="302.0" y="190" font-size="13" fill="#90aaff" font-weight="700" text-anchor="middle" letter-spacing="0.06em">INVESTIGATE</text>
  <text x="302.0" y="212" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="middle">CloudWatch +</text>
  <text x="302.0" y="227" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="middle">GitHub</text>
  <line x1="381" y1="198.0" x2="390" y2="198.0" stroke="#2c3872" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="392,162 398,162 398,156 404,156 404,150 536,150 536,156 542,156 542,162 548,162 548,234 542,234 542,240 536,240 536,246 404,246 404,240 398,240 398,234 392,234" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
