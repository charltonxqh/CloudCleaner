  <text x="84" y="450" font-size="14" fill="#a2acd8" font-weight="400" text-anchor="start">risk scoring · safety rules · dependency ordering (Kahn)</text>
  <polygon points="56,490 62,490 62,484 68,484 68,478 1532,478 1532,484 1538,484 1538,490 1544,490 1544,526 1538,526 1538,532 1532,532 1532,538 68,538 68,532 62,532 62,526 56,526" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
  <rect x="56" y="478" width="4" height="60" fill="#b9a3ff"/>
  <text x="84" y="504" font-size="13" fill="#b9a3ff" font-weight="700" text-anchor="start" letter-spacing="0.06em">EVIDENCE</text>
  <text x="84" y="524" font-size="14" fill="#a2acd8" font-weight="400" text-anchor="start">typed reasoning trail, one event per decision</text>
  <polygon points="56,564 62,564 62,558 68,558 68,552 1532,552 1532,558 1538,558 1538,564 1544,564 1544,600 1538,600 1538,606 1532,606 1532,612 68,612 68,606 62,606 62,600 56,600" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
  <rect x="56" y="552" width="4" height="60" fill="#ffd76e"/>
  <text x="84" y="578" font-size="13" fill="#ffd76e" font-weight="700" text-anchor="start" letter-spacing="0.06em">STORAGE</text>
  <text x="84" y="598" font-size="14" fill="#a2acd8" font-weight="400" text-anchor="start">SQLite: runs · decisions · events · snapshots · checkpoints</text>
  <text x="56" y="726" font-size="14" fill="#6a75a6" font-weight="400" text-anchor="start">Nothing is executed without a human typing the resource id. Dry run is the default.</text>
</svg>
