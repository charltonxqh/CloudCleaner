<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="Fira Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="CloudCleaner architecture">
  <title>CloudCleaner architecture</title>
  <rect width="1600" height="760" fill="#060a1a"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c3872"/></marker></defs>
  <text x="56" y="62" font-size="30" fill="#e9edff" font-weight="700" text-anchor="start">How CloudCleaner works</text>
  <text x="56" y="92" font-size="16" fill="#a2acd8" font-weight="400" text-anchor="start">Ten LangGraph nodes. Two gates stand between a verdict and an irreversible action.</text>
  <polygon points="56,162 62,162 62,156 68,156 68,150 200,150 200,156 206,156 206,162 212,162 212,234 206,234 206,240 200,240 200,246 68,246 68,240 62,240 62,234 56,234" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
  <rect x="56" y="150" width="156" height="4" fill="#90aaff"/>
  <text x="134.0" y="190" font-size="13" fill="#90aaff" font-weight="700" text-anchor="middle" letter-spacing="0.06em">DETECT</text>
  <text x="134.0" y="212" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="middle">inventory + true</text>
  <text x="134.0" y="227" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="middle">cost</text>
  <line x1="213" y1="198.0" x2="222" y2="198.0" stroke="#2c3872" stroke-width="2" marker-end="url(#a)"/>
