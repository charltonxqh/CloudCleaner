  <text x="470.0" y="190" font-size="13" fill="#b9a3ff" font-weight="700" text-anchor="middle" letter-spacing="0.06em">ASSESS</text>
  <text x="470.0" y="212" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="middle">LLM verdict, typed</text>
  <line x1="549" y1="198.0" x2="558" y2="198.0" stroke="#2c3872" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="560,162 566,162 566,156 572,156 572,150 704,150 704,156 710,156 710,162 716,162 716,234 710,234 710,240 704,240 704,246 572,246 572,240 566,240 566,234 560,234" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
