  <text x="638.0" y="212" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="middle">ordered teardown</text>
  <line x1="717" y1="198.0" x2="726" y2="198.0" stroke="#2c3872" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="728,162 734,162 734,156 740,156 740,150 872,150 872,156 878,156 878,162 884,162 884,234 878,234 878,240 872,240 872,246 740,246 740,240 734,240 734,234 728,234" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
  <rect x="728" y="150" width="156" height="4" fill="#ffd76e"/>
  <text x="806.0" y="190" font-size="13" fill="#ffd76e" font-weight="700" text-anchor="middle" letter-spacing="0.06em">POLICY CHECK</text>
  <text x="806.0" y="212" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="middle">risk score,</text>
  <text x="806.0" y="227" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="middle">allow/block</text>
  <line x1="885" y1="198.0" x2="894" y2="198.0" stroke="#2c3872" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="896,162 902,162 902,156 908,156 908,150 1040,150 1040,156 1046,156 1046,162 1052,162 1052,234 1046,234 1046,240 1040,240 1040,246 908,246 908,240 902,240 902,234 896,234" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
  <rect x="896" y="150" width="156" height="4" fill="#ff9dc0"/>
  <text x="974.0" y="190" font-size="13" fill="#ff9dc0" font-weight="700" text-anchor="middle" letter-spacing="0.06em">APPROVAL</text>
  <text x="974.0" y="212" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="middle">human types the id</text>
  <line x1="1053" y1="198.0" x2="1062" y2="198.0" stroke="#2c3872" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="1064,162 1070,162 1070,156 1076,156 1076,150 1208,150 1208,156 1214,156 1214,162 1220,162 1220,234 1214,234 1214,240 1208,240 1208,246 1076,246 1076,240 1070,240 1070,234 1064,234" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
  <rect x="1064" y="150" width="156" height="4" fill="#ff9dc0"/>
  <text x="1142.0" y="190" font-size="13" fill="#ff9dc0" font-weight="700" text-anchor="middle" letter-spacing="0.06em">EXECUTE</text>
  <text x="1142.0" y="212" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="middle">boto3, dry run</text>
  <text x="1142.0" y="227" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="middle">default</text>
  <line x1="1221" y1="198.0" x2="1230" y2="198.0" stroke="#2c3872" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="1232,162 1238,162 1238,156 1244,156 1244,150 1376,150 1376,156 1382,156 1382,162 1388,162 1388,234 1382,234 1382,240 1376,240 1376,246 1244,246 1244,240 1238,240 1238,234 1232,234" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
  <rect x="1232" y="150" width="156" height="4" fill="#90aaff"/>
  <text x="1310.0" y="190" font-size="13" fill="#90aaff" font-weight="700" text-anchor="middle" letter-spacing="0.06em">VERIFY</text>
  <text x="1310.0" y="212" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="middle">poll actual state</text>
  <line x1="1389" y1="198.0" x2="1398" y2="198.0" stroke="#2c3872" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="1400,162 1406,162 1406,156 1412,156 1412,150 1544,150 1544,156 1550,156 1550,162 1556,162 1556,234 1550,234 1550,240 1544,240 1544,246 1412,246 1412,240 1406,240 1406,234 1400,234" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
  <rect x="1400" y="150" width="156" height="4" fill="#b9a3ff"/>
  <text x="1478.0" y="190" font-size="13" fill="#b9a3ff" font-weight="700" text-anchor="middle" letter-spacing="0.06em">RECORD</text>
  <text x="1478.0" y="212" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="middle">history + memory</text>
  <rect x="552" y="136" width="340" height="124" fill="none" stroke="#67e3c4" stroke-width="1.5" stroke-dasharray="5 4" rx="4"/>
  <text x="722" y="126" font-size="12" fill="#67e3c4" font-weight="700" text-anchor="middle" letter-spacing="0.05em">WHAT, AND IN WHAT ORDER  ·  WHETHER IT IS ALLOWED</text>
  <polygon points="56,342 62,342 62,336 68,336 68,330 1532,330 1532,336 1538,336 1538,342 1544,342 1544,378 1538,378 1538,384 1532,384 1532,390 68,390 68,384 62,384 62,378 56,378" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
  <rect x="56" y="330" width="4" height="60" fill="#90aaff"/>
  <text x="84" y="356" font-size="13" fill="#90aaff" font-weight="700" text-anchor="start" letter-spacing="0.06em">TOOLS</text>
  <text x="84" y="376" font-size="14" fill="#a2acd8" font-weight="400" text-anchor="start">inventory · metrics · cost · volumes · addresses · actions · github</text>
  <polygon points="56,416 62,416 62,410 68,410 68,404 1532,404 1532,410 1538,410 1538,416 1544,416 1544,452 1538,452 1538,458 1532,458 1532,464 68,464 68,458 62,458 62,452 56,452" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
  <rect x="56" y="404" width="4" height="60" fill="#67e3c4"/>
