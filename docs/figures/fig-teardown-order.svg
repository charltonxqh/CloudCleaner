<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" width="1500" height="720" font-family="Fira Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Dependency-ordered teardown">
  <title>Dependency-ordered teardown</title>
  <rect width="1500" height="720" fill="#060a1a"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c3872"/></marker></defs>
  <text x="56" y="62" font-size="30" fill="#e9edff" font-weight="700" text-anchor="start">Retiring one instance is five operations</text>
  <text x="56" y="92" font-size="16" fill="#a2acd8" font-weight="400" text-anchor="start">AWS refuses dependent deletions one blocker at a time. CloudCleaner resolves the graph first.</text>
  <text x="56" y="152" font-size="12" fill="#6a75a6" font-weight="700" text-anchor="start" letter-spacing="0.07em">WHAT IT IS ENTANGLED WITH</text>
  <polygon points="190,188 196,188 196,182 202,182 202,176 398,176 398,182 404,182 404,188 410,188 410,232 404,232 404,238 398,238 398,244 202,244 202,238 196,238 196,232 190,232" fill="#161e42" stroke="#2c3872" stroke-width="1"/>
  <text x="300" y="202" font-size="14" fill="#ff9dc0" font-weight="700" text-anchor="middle" font-family="Fira Code, SF Mono, Menlo, monospace">i-0abc123</text>
  <text x="300" y="224" font-size="11" fill="#6a75a6" font-weight="400" text-anchor="middle">t3.micro, stopped</text>
  <polygon points="-10,308 -4,308 -4,302 2,302 2,296 198,296 198,302 204,302 204,308 210,308 210,352 204,352 204,358 198,358 198,364 2,364 2,358 -4,358 -4,352 -10,352" fill="#161e42" stroke="#2c3872" stroke-width="1"/>
  <text x="100" y="322" font-size="14" fill="#ffd76e" font-weight="700" text-anchor="middle" font-family="Fira Code, SF Mono, Menlo, monospace">eipalloc-0f2</text>
  <text x="100" y="344" font-size="11" fill="#6a75a6" font-weight="400" text-anchor="middle">public IPv4, associated</text>
  <polygon points="190,408 196,408 196,402 202,402 202,396 398,396 398,402 404,402 404,408 410,408 410,452 404,452 404,458 398,458 398,464 202,464 202,458 196,458 196,452 190,452" fill="#161e42" stroke="#2c3872" stroke-width="1"/>
  <text x="300" y="422" font-size="14" fill="#67e3c4" font-weight="700" text-anchor="middle" font-family="Fira Code, SF Mono, Menlo, monospace">vol-0a9b8c7</text>
  <text x="300" y="444" font-size="11" fill="#6a75a6" font-weight="400" text-anchor="middle">16 GB, DeleteOnTermination=false</text>
  <line x1="300" y1="244" x2="300" y2="396" stroke="#2c3872" stroke-width="2"/>
  <line x1="210" y1="285" x2="300" y2="285" stroke="#2c3872" stroke-width="2"/>
  <text x="300" y="480" font-size="12" fill="#6a75a6" font-weight="400" text-anchor="middle">three resources, two constraints</text>
  <text x="700" y="152" font-size="12" fill="#67e3c4" font-weight="700" text-anchor="start" letter-spacing="0.07em">THE ORDER THAT ACTUALLY WORKS</text>
  <polygon points="700,198 706,198 706,192 712,192 712,186 1428,186 1428,192 1434,192 1434,198 1440,198 1440,234 1434,234 1434,240 1428,240 1428,246 712,246 712,240 706,240 706,234 700,234" fill="#161e42" stroke="#2c3872" stroke-width="1"/>
  <text x="726" y="223" font-size="17" fill="#6a75a6" font-weight="700" text-anchor="start">1</text>
  <text x="772" y="216" font-size="15" fill="#e9edff" font-weight="600" text-anchor="start" font-family="Fira Code, SF Mono, Menlo, monospace">disassociate_address</text>
  <text x="772" y="233" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="start" font-family="Fira Code, SF Mono, Menlo, monospace">eipassoc-0c1b2a3</text>
  <line x1="1070" y1="247" x2="1070" y2="258" stroke="#2c3872" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="700,272 706,272 706,266 712,266 712,260 1428,260 1428,266 1434,266 1434,272 1440,272 1440,308 1434,308 1434,314 1428,314 1428,320 712,320 712,314 706,314 706,308 700,308" fill="#161e42" stroke="#2c3872" stroke-width="1"/>
  <text x="726" y="297" font-size="17" fill="#6a75a6" font-weight="700" text-anchor="start">2</text>
  <rect x="748" y="284" width="10" height="10" fill="#ff9dc0"/>
  <text x="772" y="290" font-size="15" fill="#e9edff" font-weight="600" text-anchor="start" font-family="Fira Code, SF Mono, Menlo, monospace">release_address</text>
  <text x="772" y="307" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="start" font-family="Fira Code, SF Mono, Menlo, monospace">eipalloc-0f2e3d4</text>
  <text x="1412" y="298" font-size="16" fill="#67e3c4" font-weight="700" text-anchor="end">$3.65</text>
  <line x1="1070" y1="321" x2="1070" y2="332" stroke="#2c3872" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="700,346 706,346 706,340 712,340 712,334 1428,334 1428,340 1434,340 1434,346 1440,346 1440,382 1434,382 1434,388 1428,388 1428,394 712,394 712,388 706,388 706,382 700,382" fill="#161e42" stroke="#2c3872" stroke-width="1"/>
  <text x="726" y="371" font-size="17" fill="#6a75a6" font-weight="700" text-anchor="start">3</text>
  <text x="772" y="364" font-size="15" fill="#e9edff" font-weight="600" text-anchor="start" font-family="Fira Code, SF Mono, Menlo, monospace">snapshot_volume</text>
  <text x="772" y="381" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="start" font-family="Fira Code, SF Mono, Menlo, monospace">vol-0a9b8c7d6</text>
  <line x1="1070" y1="395" x2="1070" y2="406" stroke="#2c3872" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="700,420 706,420 706,414 712,414 712,408 1428,408 1428,414 1434,414 1434,420 1440,420 1440,456 1434,456 1434,462 1428,462 1428,468 712,468 712,462 706,462 706,456 700,456" fill="#161e42" stroke="#2c3872" stroke-width="1"/>
  <text x="726" y="445" font-size="17" fill="#6a75a6" font-weight="700" text-anchor="start">4</text>
  <rect x="748" y="432" width="10" height="10" fill="#ff9dc0"/>
  <text x="772" y="438" font-size="15" fill="#e9edff" font-weight="600" text-anchor="start" font-family="Fira Code, SF Mono, Menlo, monospace">terminate_instance</text>
  <text x="772" y="455" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="start" font-family="Fira Code, SF Mono, Menlo, monospace">i-0abc123def456789</text>
  <text x="1412" y="446" font-size="16" fill="#67e3c4" font-weight="700" text-anchor="end">$4.93</text>
  <line x1="1070" y1="469" x2="1070" y2="480" stroke="#2c3872" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="700,494 706,494 706,488 712,488 712,482 1428,482 1428,488 1434,488 1434,494 1440,494 1440,530 1434,530 1434,536 1428,536 1428,542 712,542 712,536 706,536 706,530 700,530" fill="#161e42" stroke="#2c3872" stroke-width="1"/>
  <text x="726" y="519" font-size="17" fill="#6a75a6" font-weight="700" text-anchor="start">5</text>
  <rect x="748" y="506" width="10" height="10" fill="#ff9dc0"/>
  <text x="772" y="512" font-size="15" fill="#e9edff" font-weight="600" text-anchor="start" font-family="Fira Code, SF Mono, Menlo, monospace">delete_volume</text>
  <text x="772" y="529" font-size="11.5" fill="#6a75a6" font-weight="400" text-anchor="start" font-family="Fira Code, SF Mono, Menlo, monospace">vol-0a9b8c7d6</text>
  <text x="1412" y="520" font-size="16" fill="#67e3c4" font-weight="700" text-anchor="end">$1.28</text>
  <rect x="700" y="562" width="740" height="3" fill="#2c3872"/>
  <text x="700" y="598" font-size="14" fill="#ff9dc0" font-weight="400" text-anchor="start">3 of 5 steps cannot be undone</text>
  <text x="1440" y="598" font-size="22" fill="#67e3c4" font-weight="700" text-anchor="end">$9.86/mo</text>
</svg>
