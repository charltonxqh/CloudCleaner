  <text x="1334" y="233.0" font-size="15" fill="#6a75a6" font-weight="700" text-anchor="end">$0.00</text>
  <polygon points="976,258 981,258 981,253 986,253 986,248 1346,248 1346,253 1351,253 1351,258 1356,258 1356,264 1351,264 1351,269 1346,269 1346,274 986,274 986,269 981,269 981,264 976,264" fill="#161e42" stroke="#2c3872" stroke-width="1"/>
  <text x="998" y="267.0" font-size="14.5" fill="#6a75a6" font-weight="600" text-anchor="start">address  released</text>
  <text x="1334" y="267.0" font-size="15" fill="#6a75a6" font-weight="700" text-anchor="end">$0.00</text>
  <rect x="976" y="288" width="380" height="3" fill="#2c3872"/>
  <text x="976" y="326" font-size="13" fill="#6a75a6" font-weight="400" text-anchor="start">billed monthly</text>
  <text x="1356" y="328" font-size="24" fill="#67e3c4" font-weight="700" text-anchor="end">$0.00</text>
  <text x="56" y="580" font-size="15" fill="#a2acd8" font-weight="400" text-anchor="start">The middle column is the bill nobody expects. CloudCleaner finds it, and works out the order to dismantle it in.</text>
</svg>
