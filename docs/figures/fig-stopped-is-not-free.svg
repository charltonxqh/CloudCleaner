  <text x="1334" y="199.0" font-size="15" fill="#6a75a6" font-weight="700" text-anchor="end">$0.00</text>
  <polygon points="976,224 981,224 981,219 986,219 986,214 1346,214 1346,219 1351,219 1351,224 1356,224 1356,230 1351,230 1351,235 1346,235 1346,240 986,240 986,235 981,235 981,230 976,230" fill="#161e42" stroke="#2c3872" stroke-width="1"/>
