<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" width="1440" height="620" font-family="Fira Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Three gates before anything is destroyed">
  <title>Three gates before anything is destroyed</title>
  <rect width="1440" height="620" fill="#060a1a"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c3872"/></marker></defs>
  <text x="56" y="62" font-size="30" fill="#e9edff" font-weight="700" text-anchor="start">Three gates before anything is destroyed</text>
  <text x="56" y="92" font-size="16" fill="#a2acd8" font-weight="400" text-anchor="start">A human can overrule the model. Nobody overrules the policy.</text>
  <polygon points="56,162 62,162 62,156 68,156 68,150 460,150 460,156 466,156 466,162 472,162 472,438 466,438 466,444 460,444 460,450 68,450 68,444 62,444 62,438 56,438" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
  <rect x="56" y="150" width="416" height="4" fill="#b9a3ff"/>
  <text x="86" y="206" font-size="34" fill="#b9a3ff" font-weight="700" text-anchor="start">1</text>
  <text x="86" y="244" font-size="14" fill="#b9a3ff" font-weight="700" text-anchor="start" letter-spacing="0.06em">THE MODEL ADVISES</text>
  <text x="86" y="288" font-size="15.5" fill="#a2acd8" font-weight="400" text-anchor="start">Reads only the evidence</text>
  <text x="86" y="318" font-size="15.5" fill="#a2acd8" font-weight="400" text-anchor="start">Returns a typed verdict</text>
  <text x="86" y="348" font-size="15.5" fill="#a2acd8" font-weight="400" text-anchor="start">Can be wrong, and can be</text>
  <text x="86" y="378" font-size="15.5" fill="#a2acd8" font-weight="400" text-anchor="start">overruled by a human</text>
  <line x1="474" y1="300" x2="496" y2="300" stroke="#2c3872" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="504,162 510,162 510,156 516,156 516,150 908,150 908,156 914,156 914,162 920,162 920,438 914,438 914,444 908,444 908,450 516,450 516,444 510,444 510,438 504,438" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
  <rect x="504" y="150" width="416" height="4" fill="#67e3c4"/>
  <text x="534" y="206" font-size="34" fill="#67e3c4" font-weight="700" text-anchor="start">2</text>
  <text x="534" y="244" font-size="14" fill="#67e3c4" font-weight="700" text-anchor="start" letter-spacing="0.06em">THE POLICY DECIDES</text>
  <text x="534" y="288" font-size="15.5" fill="#a2acd8" font-weight="400" text-anchor="start">Plain Python, no prompt</text>
  <text x="534" y="318" font-size="15.5" fill="#a2acd8" font-weight="400" text-anchor="start">Protected environments,</text>
  <text x="534" y="348" font-size="15.5" fill="#a2acd8" font-weight="400" text-anchor="start">tags, age, risk score</text>
  <text x="534" y="378" font-size="15.5" fill="#a2acd8" font-weight="400" text-anchor="start">Cannot be argued with</text>
  <line x1="922" y1="300" x2="944" y2="300" stroke="#2c3872" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="952,162 958,162 958,156 964,156 964,150 1356,150 1356,156 1362,156 1362,162 1368,162 1368,438 1362,438 1362,444 1356,444 1356,450 964,450 964,444 958,444 958,438 952,438" fill="#0e1430" stroke="#2c3872" stroke-width="1"/>
  <rect x="952" y="150" width="416" height="4" fill="#ff9dc0"/>
  <text x="982" y="206" font-size="34" fill="#ff9dc0" font-weight="700" text-anchor="start">3</text>
  <text x="982" y="244" font-size="14" fill="#ff9dc0" font-weight="700" text-anchor="start" letter-spacing="0.06em">A HUMAN COMMITS</text>
  <text x="982" y="288" font-size="15.5" fill="#a2acd8" font-weight="400" text-anchor="start">Types the resource id</text>
  <text x="982" y="318" font-size="15.5" fill="#a2acd8" font-weight="400" text-anchor="start">exactly — never y/n</text>
  <text x="982" y="348" font-size="15.5" fill="#a2acd8" font-weight="400" text-anchor="start">Sees the ordered plan</text>
  <text x="982" y="378" font-size="15.5" fill="#a2acd8" font-weight="400" text-anchor="start">and what cannot be undone</text>
  <polygon points="56,498 62,498 62,492 68,492 68,486 1372,486 1372,492 1378,492 1378,498 1384,498 1384,552 1378,552 1378,558 1372,558 1372,564 68,564 68,558 62,558 62,552 56,552" fill="#161e42" stroke="#2c3872" stroke-width="1"/>
  <text x="88" y="520" font-size="15" fill="#ffd76e" font-weight="700" text-anchor="start" font-family="Fira Code, SF Mono, Menlo, monospace">force_plan</text>
  <text x="88" y="545" font-size="14.5" fill="#a2acd8" font-weight="400" text-anchor="start">A human who disagrees with the model can force a plan — and the policy still refuses it on a protected resource.</text>
</svg>
